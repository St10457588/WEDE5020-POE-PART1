<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Service Enquiry | Apex Plumbing Solutions</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <header>
        <h1>Apex Plumbing Solutions</h1>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="services.html">Services</a></li>
                <li><a href="enquiry.html" class="active">Enquiry</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="form-container">
            <h2>Service Enquiry Form</h2>
            <form action="#" method="post">
                <label for="fullname">Full Name:</label><br>
                <input type="text" id="fullname" name="fullname" required><br><br>

                <label for="email">Email Address:</label><br>
                <input type="email" id="email" name="email" required><br><br>

                <label for="service-type">Requested Service:</label><br>
                <select id="service-type" name="service-type">
                    <option value="leak">Emergency Leak Repair</option>
                    <option value="drain">Drain Cleaning</option>
                    <option value="geyser">Geyser Maintenance</option>
                </select><br><br>

                <label for="message">Detailed Description:</label><br>
                <textarea id="message" name="message" rows="5" required></textarea><br><br>

                <button type="submit">Submit Enquiry</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Apex Plumbing Solutions. All Rights Reserved.</p>
    </footer>

</body>
</html>
